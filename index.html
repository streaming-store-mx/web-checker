
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Checker - Panel</title>
    <!-- Tailwind CSS para un diseño rápido y moderno -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-800 rounded-xl shadow-lg p-6 border border-gray-700">
        <h1 class="text-2xl font-bold mb-2 text-center text-green-400">Web Checker</h1>
        <p class="text-sm text-gray-400 mb-4 text-center">Pega tu lista de cuentas (correo:contraseña)</p>

        <!-- Área de texto para las cuentas -->
        <textarea id="listaCuentas" rows="6" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-gray-200 focus:outline-none focus:border-green-500 mb-4 font-mono" placeholder="correo@dominio.com:contraseña"></textarea>

        <!-- Botón de acción -->
        <button onclick="iniciarProceso()" class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
            Iniciar Verificación
        </button>

        <!-- Consola de resultados -->
        <div id="resultado" class="mt-4 hidden">
            <h2 class="text-xs font-semibold uppercase text-gray-400 mb-2">Estado del Proceso:</h2>
            <div id="log" class="bg-gray-900 border border-gray-700 rounded-lg p-3 text-xs font-mono text-green-400 h-32 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        function iniciarProceso() {
            const texto = document.getElementById('listaCuentas').value.trim();
            const divResultado = document.getElementById('resultado');
            const logBox = document.getElementById('log');

            if (!texto) {
                alert("Por favor ingresa al menos una cuenta.");
                return;
            }

            divResultado.classList.remove('hidden');
            logBox.innerHTML = "✅ PROCESAMIENTO INICIADO...<br>";

            const lineas = texto.split('\n');
            logBox.innerHTML += `📊 Total de cuentas detectadas: ${lineas.length}<br>`;

            // Simulación visual del proceso
            lineas.forEach((linea, index) => {
                setTimeout(() => {
                    logBox.innerHTML += `🔍 Verificando: ${linea.split(':')[0]}...<br>`;
                    logBox.scrollTop = logBox.scrollHeight;
                }, (index + 1) * 800);
            });
        }
    </script>

</body>
</html>
